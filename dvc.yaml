stages:
  make_dataset:
    cmd: python src/data/make_dataset.py --output_dir data/processed --test_size 0.2
    deps:
      - src/data/make_dataset.py
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  build_features:
    cmd: python src/features/build_features.py --input_dir data/processed --output_dir data/processed --model_dir models
    deps:
      - src/features/build_features.py
      - data/processed/train.csv
      - data/processed/test.csv
    outs:
      - data/processed/train_features.csv
      - data/processed/test_features.csv
      - models/scaler.pkl

  train_model:
    cmd: python src/models/train_model.py --input_dir data/processed --model_dir models
    deps:
      - src/models/train_model.py
      - data/processed/train_features.csv
      - data/processed/test_features.csv
    outs:
      - models/model.pkl

  predict_model:
    cmd: python src/models/predict_model.py --input data/processed/test.csv --output reports/predictions.csv --model_dir models
    deps:
      - src/models/predict_model.py
      - data/processed/test.csv
      - models/model.pkl
      - models/scaler.pkl
    outs:
      - reports/predictions.csv
  visualize:
    cmd: python src/visualization/visualize.py --predictions reports/predictions.csv --model_dir models --output_dir reports/figures
    deps:
      - src/visualization/visualize.py
      - reports/predictions.csv
      - models/model.pkl
    outs:
      - reports/figures/confusion_matrix.png
      - reports/figures/feature_importance.png